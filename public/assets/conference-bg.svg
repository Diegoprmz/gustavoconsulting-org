<svg width="1920" height="1400" viewBox="0 0 1920 1400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1220" />
      <stop offset="55%" stop-color="#0F1C36" />
      <stop offset="100%" stop-color="#070C16" />
    </linearGradient>
    <radialGradient id="spotlight" cx="50%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.22" />
      <stop offset="45%" stop-color="#C9A84C" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070C16" stop-opacity="0" />
      <stop offset="100%" stop-color="#070C16" stop-opacity="0.55" />
