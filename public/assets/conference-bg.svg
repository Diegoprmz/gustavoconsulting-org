    <path d="M 400 1400 L 960 1000 L 1520 1400" fill="none" />
    <path d="M 500 1400 L 960 1040 L 1420 1400" fill="none" />
  </g>

  <!-- faint seat-row bands -->
  <g fill="#F5F5F5" opacity="0.025">
